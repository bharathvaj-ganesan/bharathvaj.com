<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="pipe-t pipe-d">
  <title id="pipe-t">deepsec pipeline</title>
  <desc id="pipe-d">Five stages: scan (free), process (paid AI), revalidate (paid AI), enrich (free), export (read-only).</desc>
  <defs>
    <marker id="pipe-ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="878" height="298" rx="14" fill="#f5f7fa" stroke="#d8dde4"/>
  <text x="36" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1c2230">How one run moves through deepsec</text>

  <!-- Stage 1: scan -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="102" y="60" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5d6679" text-anchor="middle">STEP 1</text>
    <rect x="36" y="70" width="132" height="150" rx="10" fill="#ffffff" stroke="#cfd6e0"/>
    <text x="102" y="98" font-size="17" font-weight="600" fill="#1c2230" text-anchor="middle">scan</text>
    <text x="102" y="124" font-size="12" fill="#5d6679" text-anchor="middle">Regex matchers</text>
    <text x="102" y="142" font-size="12" fill="#5d6679" text-anchor="middle">flag candidates</text>
    <rect x="60" y="170" width="84" height="22" rx="11" fill="#dff3ea"/>
    <text x="102" y="185" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1d7f56" text-anchor="middle">FREE</text>
  </g>
  <line x1="170" y1="145" x2="200" y2="145" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#pipe-ah)"/>

  <!-- Stage 2: process -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="271" y="60" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5d6679" text-anchor="middle">STEP 2</text>
    <rect x="205" y="70" width="132" height="150" rx="10" fill="#ffffff" stroke="#cfd6e0"/>
    <text x="271" y="98" font-size="17" font-weight="600" fill="#1c2230" text-anchor="middle">process</text>
    <text x="271" y="124" font-size="12" fill="#5d6679" text-anchor="middle">AI reviews the</text>
    <text x="271" y="142" font-size="12" fill="#5d6679" text-anchor="middle">flagged spots</text>
    <rect x="229" y="170" width="84" height="22" rx="11" fill="#fbeedf"/>
    <text x="271" y="185" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#b4530b" text-anchor="middle">PAID · AI</text>
  </g>
  <line x1="339" y1="145" x2="369" y2="145" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#pipe-ah)"/>

  <!-- Stage 3: revalidate -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="440" y="60" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5d6679" text-anchor="middle">STEP 3</text>
    <rect x="374" y="70" width="132" height="150" rx="10" fill="#ffffff" stroke="#cfd6e0"/>
    <text x="440" y="98" font-size="17" font-weight="600" fill="#1c2230" text-anchor="middle">revalidate</text>
    <text x="440" y="124" font-size="12" fill="#5d6679" text-anchor="middle">AI re-checks code</text>
    <text x="440" y="142" font-size="12" fill="#5d6679" text-anchor="middle">and git history</text>
    <rect x="398" y="170" width="84" height="22" rx="11" fill="#fbeedf"/>
    <text x="440" y="185" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#b4530b" text-anchor="middle">PAID · AI</text>
  </g>
  <line x1="508" y1="145" x2="538" y2="145" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#pipe-ah)"/>

  <!-- Stage 4: enrich -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="609" y="60" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5d6679" text-anchor="middle">STEP 4</text>
    <rect x="543" y="70" width="132" height="150" rx="10" fill="#ffffff" stroke="#cfd6e0"/>
    <text x="609" y="98" font-size="17" font-weight="600" fill="#1c2230" text-anchor="middle">enrich</text>
    <text x="609" y="124" font-size="12" fill="#5d6679" text-anchor="middle">Adds committer</text>
    <text x="609" y="142" font-size="12" fill="#5d6679" text-anchor="middle">and owner info</text>
    <rect x="567" y="170" width="84" height="22" rx="11" fill="#dff3ea"/>
    <text x="609" y="185" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1d7f56" text-anchor="middle">FREE</text>
  </g>
  <line x1="677" y1="145" x2="707" y2="145" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#pipe-ah)"/>

  <!-- Stage 5: export -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="778" y="60" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5d6679" text-anchor="middle">STEP 5</text>
    <rect x="712" y="70" width="132" height="150" rx="10" fill="#ffffff" stroke="#cfd6e0"/>
    <text x="778" y="98" font-size="17" font-weight="600" fill="#1c2230" text-anchor="middle">export</text>
    <text x="778" y="124" font-size="12" fill="#5d6679" text-anchor="middle">Writes Markdown</text>
    <text x="778" y="142" font-size="12" fill="#5d6679" text-anchor="middle">or JSON reports</text>
    <rect x="732" y="170" width="92" height="22" rx="11" fill="#eceff3"/>
    <text x="778" y="185" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5d6679" text-anchor="middle">READ-ONLY</text>
  </g>

  <!-- Legend and note -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5d6679">
    <rect x="36" y="244" width="12" height="12" rx="3" fill="#1d7f56"/>
    <text x="54" y="255">free</text>
    <rect x="104" y="244" width="12" height="12" rx="3" fill="#b4530b"/>
    <text x="122" y="255">paid (AI calls)</text>
    <rect x="236" y="244" width="12" height="12" rx="3" fill="#8a94a6"/>
    <text x="254" y="255">no model calls</text>
    <text x="36" y="282" font-size="12.5">Re-runs skip files that are already analyzed. If a run stops, run the same command again.</text>
  </g>
</svg>
